# Single-service repo: literal context "." and a GitHub build-provenance attestation.
# Generated from testenv/topology/topology.yaml by testenv/topology/generate.js. Do not edit by hand.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PUSH_SA }}
          token_format: access_token

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.AR_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ vars.AR_REPO }}/identity:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ vars.AR_REPO }}/identity
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
